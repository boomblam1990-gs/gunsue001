<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>กุนซือ · Gunsue — เครื่องยนต์บริหารยุทธศาสตร์</title>
  <meta name="description" content="กุนซือ (Gunsue) เครื่องยนต์บริหารยุทธศาสตร์อัจฉริยะ" />
  <!-- React + Babel + Puter จาก CDN (ไม่ต้อง build) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    html,body{margin:0;padding:0;background:#EEF2FB;font-family:system-ui,-apple-system,'IBM Plex Sans Thai',sans-serif;}
    #boot{padding:60px 20px;text-align:center;color:#6B7793;font-size:15px;}
    #boot .dot{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#6D5FEF;animation:b 1s infinite alternate;}
    #boot .dot:nth-child(2){animation-delay:.2s;} #boot .dot:nth-child(3){animation-delay:.4s;}
    @keyframes b{from{opacity:.3;}to{opacity:1;}}
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">กำลังเปิดกุนซือ <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <script>
    (async function () {
      try {
        // โหลดโค้ดคอมโพเนนต์ (ไฟล์ gunsue.jsx ที่อยู่โฟลเดอร์เดียวกัน)
        const res = await fetch("./gunsue.jsx");
        if (!res.ok) throw new Error("fetch " + res.status);
        let src = await res.text();
        // ปรับให้รันแบบไม่มีระบบโมดูล: ตัด import / export ออก แล้วดึง hook จาก React ส่วนกลาง
        src = src.replace(/import\s+React[^\n]*\n/, "");
        src = src.replace("export default function Gunsue", "function Gunsue");
        src = "const {useState,useMemo,useRef}=React;\n" + src + "\nwindow.__GUNSUE__ = Gunsue;";
        const out = Babel.transform(src, { presets: ["react"] }).code;
        eval(out);
        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__GUNSUE__));
      } catch (e) {
        document.getElementById("root").innerHTML =
          '<div id="boot">เปิดไม่สำเร็จ<br/><br/>หน้านี้ต้องเปิดผ่าน <b>GitHub Pages</b> หรือเว็บเซิร์ฟเวอร์ ไม่สามารถเปิดไฟล์ index.html ตรง ๆ จากเครื่องได้ (เพราะต้องโหลดไฟล์ gunsue.jsx)<br/><br/><small>' + (e && e.message ? e.message : "") + "</small></div>";
      }
    })();
  </script>
</body>
</html>
